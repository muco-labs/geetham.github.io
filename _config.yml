title: Geetham
description: >-
  Personal website of Geetham, built with Jekyll and hosted on GitHub Pages.
url: "https://geetham.github.io"
baseurl: ""

theme: minima

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Files that must never be copied into the built site.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - README.md
  - .cursor
